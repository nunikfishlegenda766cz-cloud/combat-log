name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Post Klonování repozitáře
        uses: actions/checkout@v4

      - name: Post Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build pomocí Mavenu
        run: mvn package

      - name: Nahrání artefaktu (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: CombatLogPlugin
          path: target/*.jar
